version: "3.8"

services:
  # --- BASE DE DATOS (POSTGRES) ---
  postgres:
    image: postgres:15-alpine
    container_name: postgres_container
    restart: unless-stopped
    environment:
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "maizdb"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Si tienes un script de restauración, descomenta la siguiente línea:
      # - ./restore.sh:/docker-entrypoint-initdb.d/restore.sh
    networks:
      - red_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d maizdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- GESTOR PGADMIN ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: "isaac@isaac.com"
      PGADMIN_DEFAULT_PASSWORD: "computer"
    ports:
      - "7070:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - .:/respaldos
    networks:
      - red_local

  # --- CEREBRO IA (PYTHON) ---
  # Este servicio ya NO se expone al host. Solo Node lo ve internamente.
  python_backend:
    build: ./maiz_backend_python
    container_name: python_backend
    restart: unless-stopped
    env_file: .env
    # QUITAMOS 'ports' para evitar conflicto en el 8000.
    # Expose solo informa a Docker que este contenedor escucha en el 8000 interno.
    expose:
      - "8000"
    volumes:
      - ./maiz_backend_python:/app
      # COMPARTIDO: Montamos la misma carpeta de uploads que Node
      - ./maiz_backend_node/uploads:/app/uploads
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - red_local

  # --- GATEWAY & API (NODE.JS) ---
  # Este es el ÚNICO servicio que tu App Flutter ve.
  node_backend:
    build:
      context: ./maiz_backend_node
      dockerfile: Dockerfile
    container_name: node_backend
    restart: unless-stopped
    # expone el puerto del gateway API
    ports:
      - "8000:8000" # Publico en 80, interno en 8000

    depends_on:
      postgres:
        condition: service_healthy
      python_backend:
        condition: service_started
    env_file: .env
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - PYTHON_API_KEY=${PYTHON_API_KEY}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_SECURE=${EMAIL_SECURE}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FALLBACK=${EMAIL_FALLBACK}
      - APP_URL=${APP_URL}
    volumes:
      - ./maiz_backend_node:/app
      # COMPARTIDO: Carpeta donde se guardan las imágenes
      - ./maiz_backend_node/uploads:/app/uploads
    networks:
      - red_local

  # --- GESTOR DE DOCKER (PORTAINER) ---
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer_container
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - red_local

volumes:
  postgres_data:
  pgadmin_data:
  portainer_data:

networks:
  red_local:
    driver: bridge
