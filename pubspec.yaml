name: maiz_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.4+14

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  sqflite: ^2.4.0
  image_picker: ^1.0.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.0.0
  flutter_dotenv: ^6.0.0
  connectivity_plus: ^6.0.0
  cupertino_icons: ^1.0.2
  device_info_plus: ^10.0.0
  fl_chart: ^0.70.0
  geolocator: ^13.0.0
  path_provider: ^2.1.0
  url_launcher: ^6.3.0
  camera: ^0.10.5+5
  change_app_package_name: ^1.5.0
  crypto: ^3.0.2
  pdf: ^3.11.1
  printing: ^5.13.4
  flutter_file_dialog: ^3.0.2
  path: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/app_icon.png
    - assets/imagen_login.jpg
    - assets/guide/
